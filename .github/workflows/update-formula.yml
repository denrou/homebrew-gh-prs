name: Update Formula

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned: the master ref is deprecated and will hard-error at Homebrew 5.2.0.
      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      # Let brew resolve this checkout as the denrou/gh-prs tap so
      # `update-python-resources` can operate on it (and edit it in place).
      - name: Register checkout as a tap
        run: |
          taps="$(brew --repository)/Library/Taps/denrou"
          mkdir -p "$taps"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-gh-prs"

      # Point the formula's own url/sha256 at the latest PyPI sdist. The
      # version is carried in the url, so there is no separate version line
      # to bump; update-python-resources infers it from the url below.
      - name: Bump to the latest release
        run: |
          read -r url sha256 <<EOF
          $(python3 - <<'PY'
          import json, urllib.request
          d = json.load(urllib.request.urlopen("https://pypi.org/pypi/gh-prs/json"))
          v = d["info"]["version"]
          sdist = next(u for u in d["releases"][v] if u["packagetype"] == "sdist")
          print(sdist["url"], sdist["digests"]["sha256"])
          PY
          )
          EOF
          sed -i -E "s#^  url \".*\"#  url \"${url}\"#" Formula/gh-prs.rb
          sed -i -E "s#^  sha256 \".*\"#  sha256 \"${sha256}\"#" Formula/gh-prs.rb

      # Regenerate the dependency resource blocks with Homebrew's own tooling
      # (the maintained replacement for homebrew-pypi-poet).
      # --ignore-main-package-cooldown lets this run the same day as a release:
      # PyPI's fresh-upload guard would otherwise hide the just-published
      # version. Dependencies are long-published, so they still respect it.
      - name: Regenerate resources
        run: |
          brew update-python-resources --ignore-main-package-cooldown \
            denrou/gh-prs/gh-prs

      - name: Sanity-check the formula
        run: brew style denrou/gh-prs/gh-prs

      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- Formula/gh-prs.rb; then
            echo "Formula already up to date; nothing to commit."
            exit 0
          fi
          version="$(python3 -c 'import json,urllib.request;print(json.load(urllib.request.urlopen("https://pypi.org/pypi/gh-prs/json"))["info"]["version"])')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Update gh-prs to ${version}"
          # Authenticate the push explicitly: checkout's persisted auth header
          # doesn't survive the Homebrew tap-symlink environment, so a plain
          # `git push origin` has no credentials here. The refspec is needed
          # too — the checkout has no upstream branch.
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
